services:
  # Node.js + Express + TypeScript + pg
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: funch_backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - AUTH_SECRET=${AUTH_SECRET:?Set AUTH_SECRET in backend/.env}
      - AUTH_URL=${AUTH_URL:-http://localhost:5000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - DATABASE_URL=${DOCKER_DATABASE_URL:-${DATABASE_URL:?Set DOCKER_DATABASE_URL in backend/.env using host postgres}}
      - SEED_USER_PASSWORD=${SEED_USER_PASSWORD:-}
    volumes:
      - ./src:/app/src
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 5

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: funch_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:-funch_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - funch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-funch_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # PGAdmin 4 (PGPage) Web Management UI
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: funch_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in backend/.env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in backend/.env}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - funch_pgadmin_data:/var/lib/pgadmin
      - ./servers.json:/pgadmin4/servers.json
    depends_on:
      - postgres

volumes:
  funch_pgdata:
    driver: local
  funch_pgadmin_data:
    driver: local

